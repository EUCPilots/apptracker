# Update JSON via my self-hosted runner
name: 'Update self-hosted'

# Environment variables
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Controls when the action will run.
on:
  schedule:
    - cron: "00 11 * * *"
  workflow_dispatch:

jobs:
  update-powershell:
    runs-on: [self-hosted, macos, arm64]
    permissions:
      contents: write
    outputs:
      report-artifact: ${{ steps.upload-results.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install modules
        shell: pwsh
        run: |
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          Get-PSResourceRepository | Set-PSResourceRepository -Trusted
          Install-PSResource -Name "DnsClient-PS"
          Install-PSResource -Name "Evergreen" -Prerelease
          Update-Evergreen

      # Run Pester tests
      - name: Update app JSON
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          . "${{ github.workspace }}/scripts/Update-JsonHosted.ps1" -Path "${{ github.workspace }}/json" -ReportPath "$env:RUNNER_TEMP/application-results-${{ github.run_id }}-${{ github.run_attempt }}.json"

          # Write the supported apps to a JSON file for reference
          Find-EvergreenApp | ConvertTo-Json | Out-File "${{ github.workspace }}/json/supported-apps.json" -Encoding utf8 -Force

      - name: Upload application results
        id: upload-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: application-results
          path: ${{ runner.temp }}/application-results-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 14

      # Format the date number for the commit message
      - name: Get date
        id: get-date
        shell: pwsh
        run: |
          $Date = Get-Date -Format "yyyy.MM.dd"
          echo "date=$Date" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit changes
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email ${{ secrets.COMMIT_EMAIL }}
          git config --global user.name ${{ secrets.COMMIT_NAME }}
          git add .
          git commit -m "Update json ${{ steps.get-date.outputs.date }}.${{ github.run_number }} ${{ github.job }}"
          git push origin main

  reconcile-application-issues:
    needs: [update-powershell]
    if: ${{ !cancelled() && needs.update-powershell.outputs.report-artifact != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: application-issue-reconciliation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.update-powershell.outputs.report-artifact }}
          path: ${{ runner.temp }}/application-results
          merge-multiple: true

      - name: Reconcile application issues
        shell: pwsh
        run: |
          $Reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/application-results" -Filter "application-results-*.json" -File -ErrorAction Stop)
          if ($Reports.Count -ne 1) { throw "Expected exactly one application results report." }
          ./scripts/Sync-ApplicationIssues.ps1 -ReportPath $Reports[0].FullName
